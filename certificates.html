<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="crt-overlay">
    <!-- Matrix Background Layer -->

                </div>
                <ul class="nav-links">
                    <li><a href="index.html#achievements"><i class="fas fa-arrow-left"></i> Return to Main OS</a></li>
                </ul>
            </div>
        </nav>

        <main style="padding-top: 150px;">
            <section class="section achievements-section" style="min-height: calc(100vh - 150px); padding-top: 50px;">
                <div class="section-container">
                    <h2 class="section-title">Credential Archive</h2>
                    <p style="color: var(--text-muted); margin-bottom: 40px; text-align: center;">Verified certificates and completed training logs.</p>

                    <div class="cert-grid fade-in-up visible hacker-panel">
                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/hackchrono(cu).jpg.jpg&quot;)">
                            <img src="certificates.jpg/hackchrono(cu).jpg.jpg" alt="Hackchrono (CU) Certificate" class="cert-img">
                        </div>
                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/makeathon 8.jpg.jpg&quot;)">
                            <img src="certificates.jpg/makeathon 8.jpg.jpg" alt="Makeathon 8 Certificate" class="cert-img">
                        </div>
                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/muit.jpg.jpg&quot;)">
                            <img src="certificates.jpg/muit.jpg.jpg" alt="MUIT Certificate" class="cert-img">
                        </div>
                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/owasp national level.jpg.jpg&quot;)">
                            <img src="certificates.jpg/owasp national level.jpg.jpg" alt="OWASP National Level Certificate" class="cert-img">
                        </div>
                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/parul university.jpg.jpg&quot;)">
                            <img src="certificates.jpg/parul university.jpg.jpg" alt="Parul University Certificate" class="cert-img">
                        </div>
                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/tataQuiz.jpg.jpg&quot;)">
                            <img src="certificates.jpg/tataQuiz.jpg.jpg" alt="Tata Quiz Certificate" class="cert-img">

                        <div class="cert-item" onclick="openCertModal(&quot;certificates.jpg/technicia'25.jpg.jpg&quot;)">
                            <img src="certificates.jpg/technicia'25.jpg.jpg" alt="Technicia'25 Certificate" class="cert-img">

                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Sahil Bhatia. Transmission Encrypted.</p>
        </footer>
    </div>

    <!-- Modal for Full-size Certificate -->
    <div id="certModal" class="cert-modal">
        <span class="cert-modal-close" onclick="closeCertModal()">&times;</span>
        <img class="cert-modal-content" id="certModalImg">
    </div>

    <!-- Matrix logic only for the background, bypassing the rest of script.js UI requirements -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%""\'#&_(),.;:?!\\|{}<>[]^~'.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 8, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41'; // Matrix green
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                if (Math.random() > 0.95) ctx.fillStyle = '#fff';
                else ctx.fillStyle = '#0f0';

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
